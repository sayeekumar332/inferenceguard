[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferenceguard"
version = "0.1.0a0"
description = "Evidence-based differential verification for AI inference deployments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "InferenceGuard contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "pip-audit>=2,<3"]

[project.scripts]
inferenceguard = "inferenceguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
